<style>
:root {
  /* Un jardín de tinta verde sobre fondo claro; fichas en dorado. Una columna, botones grandes. */
  --bg: #E9F0EC;
  --surface: #FFFFFF;
  --ink: #14302A;
  --ink-2: #3F5B54;
  --primary: #1B6B58;
  --primary-ink: #FFFFFF;
  --accent: #F2B01E;
  --accent-ink: #3A2A00;
  --line: #BCCEC7;
  --good: #1F7A4A;
  --warn: #A8480F;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }

body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(rgba(233,240,236,.50), rgba(233,240,236,.78)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid #2B59C3; outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
#app { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; min-height: 100vh; }

/* barra superior */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px 0 10px; border-radius: 999px; background: rgba(255,255,255,.88); font-family: var(--font-display); font-size: 26px; color: var(--primary); }
.brand svg { width: 38px; height: 38px; flex: none; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 52px; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
.icon-btn svg { width: 26px; height: 26px; }
.coins { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px 0 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.coins svg { width: 30px; height: 30px; }
.coins small { font-size: 15px; font-weight: 400; }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* botones */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; padding: 12px 20px; border-radius: 18px; border: 0; background: var(--primary); color: var(--primary-ink); font-size: 24px; font-weight: 700; box-shadow: 0 4px 0 rgba(10,50,40,.35); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(10,50,40,.35); }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: none; font-size: 20px; min-height: 56px; }
.btn.gold { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 rgba(120,80,0,.35); }
.btn.danger { background: #fff; color: var(--warn); border: 2px solid var(--warn); box-shadow: none; font-size: 19px; min-height: 52px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
a.btn { text-decoration: none; text-align: center; }
.secret { -webkit-text-security: disc; }
.bigcode { font-family: var(--font-display); font-size: 76px; font-weight: 700; letter-spacing: .14em; text-align: center; color: var(--primary); background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 10px 0 10px .14em; }
.btn.wa svg { width: 30px; height: 30px; flex: none; }
.fam { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 16px; }
.famerr { color: var(--warn); font-weight: 700; min-height: 0; }
.btn.small { min-height: 48px; font-size: 18px; width: auto; padding: 8px 16px; border-radius: 14px; }
.link-btn { background: rgba(255,255,255,.88); border: 0; border-radius: 14px; color: var(--primary); text-decoration: underline; font-size: 19px; min-height: 48px; padding: 0 16px; }

/* pantallas */
.stack { display: flex; flex-direction: column; gap: 16px; }
.hello { margin-top: 10px; padding: 14px 18px; border-radius: 20px; background: rgba(255,255,255,.88); }
.hello h1 { font-size: 32px; }
.hello p { color: var(--ink-2); margin-top: 4px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; }
.card h2 { font-size: 24px; margin-bottom: 10px; }
.diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.diff { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center; min-height: 80px; padding: 10px 4px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface); }
.diff b { font-size: 22px; display: block; }
.diff span { color: var(--ink-2); font-size: 17px; }
.diff .dots { display: flex; gap: 5px; }
.diff .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: block; }
.diff .dots i.on { background: var(--primary); }
.diff[aria-pressed="true"] { border-color: var(--primary); background: #E2F2EB; }
.meds { display: flex; flex-direction: column; gap: 10px; }
.meds p { color: var(--ink-2); }
.pill-state { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.pill-state svg { width: 30px; height: 30px; flex: none; }

/* quién juega */
.people { display: grid; gap: 12px; }
.person { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 84px; padding: 12px 16px; border-radius: 20px; border: 3px solid var(--line); background: var(--surface); text-align: left; font-size: 26px; font-weight: 700; }
.avatar { width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-display); font-size: 28px; flex: none; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
input[type="text"], input[type="password"], input[type="time"], input[type="number"], input[type="tel"] { font: inherit; font-size: 22px; padding: 10px 14px; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); width: 100%; }

/* juego */
.game-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.level-tag { text-align: center; line-height: 1.15; padding: 6px 16px; border-radius: 16px; background: rgba(255,255,255,.88); }
.level-tag b { font-family: var(--font-display); font-size: 22px; display: block; }
.level-tag span { color: var(--ink-2); font-size: 16px; }
.board { display: flex; justify-content: center; padding: 12px 0 6px; }
.grid { position: relative; }
.cell { transition: background-color .3s, color .3s, border-color .3s; position: absolute; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--ink-2); border-radius: 8px; font-weight: 700; color: transparent; }
.cell.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.cell.shine { outline: 4px solid var(--accent); outline-offset: 1px; }
.progress { align-self: center; width: fit-content; margin: 0 auto; text-align: center; color: var(--ink); font-size: 18px; min-height: 30px; padding: 2px 16px; border-radius: 999px; background: rgba(255,255,255,.88); }
.say { min-height: 52px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 22px; padding: 4px 14px; border-radius: 14px; background: rgba(255,255,255,.88); margin: 6px auto 0; width: fit-content; max-width: 100%; }
.say:empty { background: transparent; }
.say.good { color: var(--good); }
.say.warn { color: var(--warn); }
.say.info { color: var(--ink-2); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.preview { min-height: 60px; display: flex; align-items: center; justify-content: center; margin: 0 auto; padding: 4px 26px; border-radius: 999px; background: var(--primary); color: #fff; font-family: var(--font-display); font-size: 34px; letter-spacing: .12em; min-width: 120px; }
.preview.empty { background: rgba(255,255,255,.7); color: var(--ink-2); font-family: var(--font-body); letter-spacing: 0; font-size: 18px; border: 2px dashed var(--line); }
.wheel-wrap { display: flex; justify-content: center; padding: 10px 0; }
.wheel { position: relative; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
.wheel svg { position: absolute; inset: 0; pointer-events: none; }
.letter { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #F2F7F5; border: 3px solid var(--line); font-family: var(--font-display); font-weight: 700; color: var(--ink); pointer-events: none; }
.letter.sel { background: var(--primary); border-color: var(--primary); color: #fff; }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 76px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; padding: 6px 2px; }
.act svg { width: 28px; height: 28px; }
.act.go { background: var(--primary); border-color: var(--primary); color: #fff; }
.act[disabled] { opacity: .5; }

/* pantalla de juego fija: nada se desplaza ni se mueve */
html.lock, html.lock body { height: 100%; overflow: hidden; overscroll-behavior: none; }
#app.game { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; padding-top: 10px; padding-bottom: 14px; }
.game-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; flex: none; }
.game-head .icon-btn { padding: 0 12px; min-width: 0; font-size: 18px; }
.game-head .coins { padding: 0 14px 0 8px; font-size: 22px; }
.game-head .level-tag { justify-self: center; min-width: 0; }
.level-tag span { font-size: 15px; white-space: nowrap; }
.board { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0; }
.msgrow { display: flex; gap: 8px; align-items: center; flex: none; height: 60px; }
.snd { flex: none; width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.snd svg { width: 30px; height: 30px; }
.msgbox { flex: 1; min-width: 0; height: 60px; line-height: 56px; border: 2px solid transparent; text-align: center; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,.9); color: var(--ink-2); transition: background-color .2s, color .2s; }
.msgbox.idle { font-weight: 400; background: rgba(255,255,255,.75); border: 2px dashed var(--line); }
.msgbox.word { background: var(--primary); color: #fff; font-family: var(--font-display); font-size: 34px; letter-spacing: .12em; }
.msgbox.good { color: var(--good); }
.msgbox.warn { color: var(--warn); background: #FFF1DF; }
#app.game .wheel-wrap { flex: none; padding: 0; }
#app.game .actions { flex: none; }
#app.game .act { min-height: 70px; }

/* ventanas */
.overlay { position: fixed; inset: 0; background: rgba(15, 35, 30, .62); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; overflow-y: auto; }
.modal { width: 100%; max-width: 480px; background: var(--surface); border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; max-height: 100%; overflow-y: auto; }
.modal h2 { font-size: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 14px; border-radius: 999px; background: #E2F2EB; border: 2px solid #A8CDBD; font-weight: 700; font-size: 20px; letter-spacing: .06em; }
.chip.extra { background: #FFF3D1; border-color: #E8C768; }
.big-ok { width: 84px; height: 84px; border-radius: 50%; background: var(--good); display: flex; align-items: center; justify-content: center; align-self: center; animation: pop .7s ease; }
.big-ok svg { width: 52px; height: 52px; }
.err { color: var(--warn); font-weight: 700; min-height: 26px; }

/* panel del cuidador */
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.times { display: flex; flex-direction: column; gap: 8px; }
.times .row input { flex: 1; min-width: 130px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper b { font-size: 26px; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { width: 52px; height: 52px; border-radius: 14px; border: 2px solid var(--line); background: #fff; font-size: 28px; font-weight: 700; }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 700; }
.switch input { width: 28px; height: 28px; accent-color: var(--primary); }
.note { color: var(--ink-2); font-size: 17px; }
.on-photo { align-self: center; width: fit-content; margin: 8px auto 0; padding: 4px 16px; border-radius: 999px; background: rgba(255,255,255,.88); color: var(--ink); text-align: center; }
hr { border: 0; border-top: 2px solid var(--line); margin: 6px 0; width: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (min-width: 700px) { html, body { font-size: 20px; } }

function daisy() {
  let p = '';
  for (let i = 0; i < 12; i++) p += '<ellipse cx="20" cy="8.6" rx="3.5" ry="7.6" transform="rotate(' + (i * 30) + ' 20 20)"/>';
  return '<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="#fff" stroke="#8FB0A4" stroke-width="1.1">' + p + '</g><circle cx="20" cy="20" r="5.6" fill="#F2B01E" stroke="#B47F00" stroke-width="1.2"/></svg>';
}
function brand() { return '<div class="brand">' + daisy() + '<span>Margarita</span></div>'; }

let state = loadLocal() || newState();
migrate();
let view = 'who';

function uid() { return 'p' + Math.random().toString(36).slice(2, 9); }
function newState() { return { v: 1, lv: LV, sound: true, vol: 3, pin: '1234', requirePin: false, famKey: '', requireCode: false, active: null, profiles: [], updatedAt: 0 }; }
function migrate() {
  if (state.sound === undefined) state.sound = true;
  if (!state.vol) state.vol = 3;
  if (state.famKey === undefined) state.famKey = '';
  if (state.requireCode === undefined) state.requireCode = false;
  state.profiles.forEach(p => { if (!p.saved) p.saved = {}; if (!p.family) p.family = []; if (!p.meds.alerts) p.meds.alerts = {}; });
  if (state.lv !== LV) { state.profiles.forEach(p => { if (p.current) { p.credits += LEVEL_COST; p.current = null; } Object.keys(p.saved).forEach(k => { p.credits += LEVEL_COST; }); p.saved = {}; }); state.lv = LV; }
}
function newProfile(name) {
  return {
    id: uid(), name: name, color: COLORS[state.profiles.length % COLORS.length],
    diff: 'facil', credits: START_CREDITS,
    progress: { facil: 0, normal: 0, dificil: 0 }, current: null, saved: {}, family: [], pendingClaim: null, pendingCode: null,
    meds: { times: ['08:00', '14:00', '20:00'], perDose: 5, claims: {}, alerts: {} },
    stats: { levels: 0, words: 0, bonus: 0, days: {} }
  };
}
function loadLocal() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function persist() {
  state.updatedAt = Date.now(); saveLocal(); dirty = true;

  const claimed = p.meds.claims[dayKey(now)] || [];
  let cur = -1;
  times.forEach((t, i) => { if (minutes(t) - GRACE_MIN <= nowM) cur = i; });
  if (cur >= 0 && !claimed.includes(times[cur])) return { st: 'ready', time: times[cur] };

  grid.style.width = (lvl.cols * cs) + 'px'; grid.style.height = (lvl.rows * cs) + 'px';
  Object.keys(game.cells).forEach(k => {
    const rc = k.split(','), el = game.cells[k];
    el.style.left = (rc[1] * cs) + 'px'; el.style.top = (rc[0] * cs) + 'px';
    el.style.width = (cs - 3) + 'px'; el.style.height = (cs - 3) + 'px';
    el.style.fontSize = Math.round(cs * 0.58) + 'px';
  });
  paintPreview();
}
let resizeRaf = 0;
window.addEventListener('resize', function () {
  if (view !== 'game') return;
  cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(layoutGame);
});

function buildWheel() {
  const S = game.size, n = game.letters.length;
  const d = Math.round(S * (n <= 4 ? 0.27 : n === 5 ? 0.25 : 0.235));
  const R = S / 2 - d / 2 - 10, cx = S / 2, cy = S / 2;
  game.d = d; game.pos = [];
  const wheel = $('#wheel');
  wheel.style.width = S + 'px'; wheel.style.height = S + 'px';
  let h = '<svg viewBox="0 0 ' + S + ' ' + S + '" width="' + S + '" height="' + S + '"><polyline id="trace" points="" fill="none" stroke="rgba(27,107,88,.55)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  game.letters.forEach((ch, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    game.pos.push([x, y]);
    h += '<div class="letter" data-i="' + i + '" style="width:' + d + 'px;height:' + d + 'px;left:' + (x - d / 2) + 'px;top:' + (y - d / 2) + 'px;font-size:' + Math.round(d * 0.55) + 'px">' + esc(ch) + '</div>';
  });
  wheel.innerHTML = h;
}

function hit(e) {
  const r = $('#wheel').getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = game.d * 0.58;
  game.pos.forEach((p, i) => { const dd = Math.hypot(p[0] - x, p[1] - y); if (dd < bd) { bd = dd; best = i; } });
  return best;
}
function onDown(e) {
  const i = hit(e);
  if (i == null) return;
  e.preventDefault();
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
  game.drag = { added: 0 };
  const sel = game.sel;
  if (sel.includes(i)) { if (sel[sel.length - 1] === i) sel.pop(); }
  else { sel.push(i); game.drag.added = 1; SND.tap(sel.length - 1); }
  paintPreview();
}
function onMove(e) {
  if (!game.drag || game.drag.added < 1) return;
  const i = hit(e);
  if (i == null) return;
  const sel = game.sel, last = sel[sel.length - 1];
  if (i === last) return;
  if (sel.length >= 2 && i === sel[sel.length - 2]) { sel.pop(); game.drag.added = Math.max(1, game.drag.added - 1); }
  else if (!sel.includes(i)) { sel.push(i); game.drag.added++; SND.tap(sel.length - 1); }
  paintPreview();
}
function onUp() {
  if (game.drag && game.drag.added >= 2) submitWord();
  game.drag = null;
}
function currentWord() { return game.sel.map(i => game.letters[i]).join(''); }

/* Un solo espacio fijo muestra la palabra que se arma o el último mensaje */
function paintPreview() {
  const el = $('#msg'); if (!el) return;
  const w = currentWord();
  if (w) { el.textContent = w; el.className = 'msgbox word'; }
  else if (game.msg) { el.textContent = game.msg.text; el.className = 'msgbox ' + game.msg.kind; }
  else { el.textContent = 'Toca o desliza las letras'; el.className = 'msgbox idle'; }
  document.querySelectorAll('#wheel .letter').forEach(l => l.classList.toggle('sel', game.sel.includes(+l.dataset.i)));
  const tr = $('#trace');
  if (tr) tr.setAttribute('points', game.sel.map(i => game.pos[i].join(',')).join(' '));
}
function say(msg, kind) { game.msg = { text: msg, kind: kind || 'info' }; paintPreview(); }
function wordCells(w) {
  const a = [];
  for (let i = 0; i < w.w.length; i++) a.push((w.r + (w.d === 'V' ? i : 0)) + ',' + (w.c + (w.d === 'H' ? i : 0)));
  return a;
}
function isFound(w) { const rev = game.cur.revealed; return wordCells(w).every(k => rev.includes(k)); }
function paintGrid() {
  const rev = game.cur.revealed;
  Object.keys(game.cells).forEach(k => game.cells[k].classList.toggle('on', rev.includes(k)));
  const found = game.lvl.words.filter(isFound).length, total = game.lvl.words.length;
  const t = $('#lvlinfo'); if (t) t.textContent = DIFFS[game.cur.diff].name + ' · ' + found + ' de ' + total;
}
function submitWord() {
  const word = currentWord();
  game.sel = [];
  if (word.length < 3) { if (word.length) { say('Usa al menos 3 letras', 'warn'); SND.no(); } else paintPreview(); return; }
  const p = prof(), lvl = game.lvl, cur = game.cur;
  const w = lvl.words.find(x => x.w === word);
  if (w) {
    if (isFound(w)) { say('Ya encontraste ' + word, 'info'); return; }
    wordCells(w).forEach(k => { if (!cur.revealed.includes(k)) cur.revealed.push(k); });
    persist(); paintGrid();
    if (lvl.words.every(isFound)) { say('¡Completaste el nivel!', 'good'); setTimeout(finishLevel, 900); }
    else { say('¡Muy bien! ' + word, 'good'); SND.ok(); }
  } else if (lvl.bonus.includes(word)) {
    if (cur.bonus.includes(word)) say('Esa extra ya la tenías', 'info');
    else { cur.bonus.push(word); p.stats.bonus++; persist(); say('¡Palabra extra! ' + word, 'good'); SND.bonus(); }
  } else { say('No está en este juego', 'warn'); SND.no(); }
}
function useHint() {
  const p = prof(), cur = game.cur;
  if (p.credits < HINT_COST) { openModal({ t: 'nocredits', why: 'hint' }); return; }
  const open = [];
  game.lvl.words.filter(w => !isFound(w)).forEach(w => wordCells(w).forEach(k => { if (!cur.revealed.includes(k) && !open.includes(k)) open.push(k); }));
  if (!open.length) return;
  const k = open[Math.floor(Math.random() * open.length)];
  cur.revealed.push(k); p.credits -= HINT_COST; persist();
  $('#creditNum').textContent = p.credits;
  paintGrid();
  game.cells[k].classList.add('shine'); setTimeout(() => game.cells[k] && game.cells[k].classList.remove('shine'), 1600);
  if (game.lvl.words.every(isFound)) { say('¡Completaste el nivel!', 'good'); setTimeout(finishLevel, 900); }
  else { say('Te mostré una letra', 'info'); SND.hint(); }
}
function finishLevel() {
  const p = prof(), c = p.current; if (!c) return;
  const lvl = levelOf(c.diff, c.idx);
  const info = { diff: c.diff, idx: c.idx, words: lvl.words.map(w => w.w), extras: c.bonus.slice(), lap: Math.floor(c.idx / LEVELS[c.diff].length) };
  p.progress[c.diff] = c.idx + 1;
  p.stats.levels++; p.stats.words += lvl.words.length;
  const ds = dayStats(p); ds.levels++; ds.words += lvl.words.length;
  p.current = null; persist();
  SND.win();
  openModal({ t: 'done', info: info });
}

/* ===== Empezar nivel (gasta ficha) ===== */
/* Cada dificultad guarda su propio nivel empezado: current es el activo, saved los demás. */
function pendingOf(p, diff) { return (p.current && p.current.diff === diff) ? p.current : (p.saved && p.saved[diff]) || null; }
function parkOthers(p, diff) {
  if (!p.saved) p.saved = {};
  if (p.current && p.current.diff !== diff) { p.saved[p.current.diff] = p.current; p.current = null; }
}
function resumeLevel(p, diff) {
  parkOthers(p, diff);
  if (!p.current && p.saved[diff]) { p.current = p.saved[diff]; delete p.saved[diff]; }
  persist();
}
function startLevel(p, diff) {
  if (p.credits < LEVEL_COST) return false;
  parkOthers(p, diff);
  p.credits -= LEVEL_COST;
  p.current = { diff: diff, idx: p.progress[diff], revealed: [], bonus: [] };
  persist();
  return true;
}

  else if (a === 'play') {
    if (pendingOf(p, p.diff)) { resumeLevel(p, p.diff); go('game'); }
    else if (p.credits < LEVEL_COST) openModal({ t: 'nocredits', why: 'level' });
    else { startLevel(p, p.diff); go('game'); }
  }
  else if (a === 'nextlevel') {
    if (startLevel(p, modal.info.diff)) { modal = null; go('game'); } else openModal({ t: 'nocredits', why: 'level' });
  }
  else if (a === 'claim') {
    if (state.requirePin && !(modal && modal.t === 'pin')) { openModal({ t: 'pin', then: 'claim' }); return; }
    if (famList(p).length) {
      const st = medStatus(p);
      if (st.st !== 'ready') { closeModal(); render(); return; }
      if (codeMode(p)) newChallenge(p, st.time);
      openModal({ t: 'family', time: st.time, code: codeMode(p) }); return;
    }
    if (claimDose(p)) {
      popCoins = true; modal = null; render();
      const c = $('#creditNum'); if (c) c.textContent = p.credits;
    }
  }
  else if (a === 'wa') {
    if (codeMode(p)) return; /* el enlace abre WhatsApp; las fichas se dan con el código */
    p.pendingClaim = { time: modal ? modal.time : '', ts: Date.now() }; persist();
    setTimeout(function () { if (modal && modal.t === 'family') { modal.sent = true; renderModal(); } }, 600);
    return; /* el enlace abre WhatsApp */
  }
  else if (a === 'wadone') finishPending(true);
  else if (a === 'codeok') {
    const pc = p && p.pendingCode; if (!pc) { closeModal(); return; }
    const v = ($('#codeinput').value || '').trim();
    if (/^\d{4}$/.test(v) && v === famCode(state.famKey, pc.r, pc.t.replace(':', ''), pc.d)) {
      p.pendingCode = null; persist();
      if (claimDose(p)) popCoins = true;
      modal = null; render();
      const c = $('#creditNum'); if (c) c.textContent = p.credits;
    } else {
      pc.tries++;
      if (pc.tries >= 3) { newChallenge(p, pc.t); modal.err = 'Ese código no coincide y ya no quedan intentos. Toca de nuevo el botón de tu familiar para pedir un código nuevo.'; }
      else { persist(); modal.err = 'El código no coincide. Te quedan ' + (3 - pc.tries) + (3 - pc.tries === 1 ? ' intento.' : ' intentos.'); }
      renderModal();
    }
  }
  else if (a === 'confsave') {
    const v = ($('#confkey').value || '').trim().toLowerCase();
    if (!v) { $('#conferr').textContent = 'Escribe la clave.'; return; }
    state.famKey = v; persist(); render();
  }
  else if (a === 'confkey') { state.famKey = ''; persist(); render(); }
  else if (a === 'confexit') {
    confirmInfo = null;
    try { history.replaceState(null, '', location.pathname); } catch (err) {}
    go(state.profiles.length === 1 ? 'home' : 'who');
  }
  else if (a === 'care') openModal({ t: 'pin', then: 'care' });
  else if (a === 'pinok') {
    const v = ($('#pininput').value || '').trim();
    if (v !== state.pin) { $('#pinerr').textContent = 'El PIN no coincide. Prueba de nuevo.'; return; }
    const then = modal.then; modal = null;
    if (then === 'care') go('care');
    else if (then === 'claim') { if (claimDose(p)) { popCoins = true; } render(); }
    else render();
  }
  else if (a === 'shuffle') { game.letters = shuffled(game.letters); game.sel = []; buildWheel(); paintPreview(); SND.shuffle(); }
  else if (a === 'sound') { state.sound = !state.sound; persist(); const sb = $('#sndBtn'); if (sb) { sb.innerHTML = state.sound ? IC.spk : IC.mute; sb.setAttribute('aria-label', state.sound ? 'Sonido activado' : 'Sonido apagado'); } if (state.sound) SND.tap(2); }
  else if (a === 'vol') { state.vol = Math.max(1, Math.min(5, (state.vol || 3) + +b.dataset.n)); persist(); render(); SND.ok(); }
  else if (a === 'clear') { game.sel = []; paintPreview(); }
  else if (a === 'send') submitWord();
  else if (a === 'hint') useHint();
  /* panel del cuidador */
  else if (a === 'addc') { const q = pOf(b); q.credits += +b.dataset.n; persist(); render(); }
  else if (a === 'addtime') { const q = pOf(b); q.meds.times.push('12:00'); persist(); render(); }
  else if (a === 'deltime') { const q = pOf(b); q.meds.times.splice(+b.dataset.i, 1); persist(); render(); }
  else if (a === 'dose') { const q = pOf(b); q.meds.perDose = Math.max(1, Math.min(20, q.meds.perDose + +b.dataset.n)); persist(); render(); }
  else if (a === 'addfam') { const q = pOf(b); q.family = q.family || []; if (q.family.length < 3) q.family.push({ name: '', phone: '' }); persist(); render(); }
  else if (a === 'delfam') { const q = pOf(b); q.family.splice(+b.dataset.i, 1); persist(); render(); }
  else if (a === 'ics') {
    const q = pOf(b);
    if (!q.meds.times.filter(Boolean).length) return;
    try {
      const url = URL.createObjectURL(new Blob([icsText(q)], { type: 'text/calendar' })), l = document.createElement('a');
      l.href = url; l.download = 'Margarita-remedios.ics'; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (err) {}
  }
  else if (a === 'delperson') openModal({ t: 'delperson', id: pOf(b).id });
  else if (a === 'delok') {
    state.profiles = state.profiles.filter(x => x.id !== modal.id);
    if (state.active === modal.id) state.active = state.profiles[0] ? state.profiles[0].id : null;
    persist(); modal = null; if (!state.profiles.length) go('who'); else render();
  }
  else if (a === 'savepin') {
    const v = ($('#newpin').value || '').trim();
    if (!/^\d{4}$/.test(v)) { $('#pinmsg').textContent = 'El PIN debe tener 4 números.'; return; }
    state.pin = v; persist(); $('#newpin').value = ''; $('#pinmsg').textContent = 'PIN guardado.'; $('#pinmsg').style.color = 'var(--good)';
  }
});
function pOf(btn) { const c = btn.closest('[data-pid]'); return state.profiles.find(x => x.id === c.dataset.pid); }
document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'reqpin') { state.requirePin = t.checked; persist(); return; }
  if (t.id === 'reqcode') { state.requireCode = t.checked; persist(); render(); return; }
  if (t.id === 'famkey') { state.famKey = (t.value || '').trim().toLowerCase(); persist(); render(); return; }
  if (t.id === 'sndon') { state.sound = t.checked; persist(); if (state.sound) SND.ok(); return; }
  const card = t.closest && t.closest('[data-pid]'); if (!card) return;
  const q = state.profiles.find(x => x.id === card.dataset.pid); if (!q) return;
  if (t.dataset.f === 'name') { q.name = (t.value || '').trim() || q.name; persist(); }
  else if (t.dataset.f === 'time') { if (t.value) { q.meds.times[+t.dataset.i] = t.value; persist(); } }
  else if (t.dataset.f === 'fname') { const c = q.family[+t.dataset.i]; if (c) { c.name = (t.value || '').trim(); persist(); } }
  else if (t.dataset.f === 'fphone') {
    const c = q.family[+t.dataset.i]; if (!c) return;
    c.phone = (t.value || '').trim(); persist();
    const er = t.closest('.fam') && t.closest('.fam').querySelector('.famerr');
    if (er) er.textContent = (c.phone && !waNumber(c.phone)) ? 'Revisa el número. Ejemplo: +56 9 1234 5678' : '';
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    const en = e.target && e.target.dataset && e.target.dataset.enter, m2 = en && $(en);
    if (m2) { e.preventDefault(); m2.click(); return; }
    const m = $('#modal .btn:not(.alt):not(.danger)') || $('#app .btn[data-act="create"]');
    if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && m && (modal || view === 'who')) { e.preventDefault(); m.click(); }
  }
});

document.addEventListener('keydown', function (e) {
  if (view !== 'game' || modal || !game || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Enter') { e.preventDefault(); submitWord(); }
  else if (e.key === 'Backspace') { e.preventDefault(); game.sel.pop(); paintPreview(); }
  else if (/^[a-zñA-ZÑ]$/.test(e.key)) {
    const ch = e.key.toUpperCase();
    const i = game.letters.findIndex((l, j) => l === ch && !game.sel.includes(j));
    if (i >= 0) { game.sel.push(i); paintPreview(); }
  }
});

/* ===== Inicio ===== */
(function init() {
  if (state.profiles.length && (!prof())) state.active = state.profiles[0].id;
  if (state.profiles.length === 1) { state.active = state.profiles[0].id; view = 'home'; }
  confirmInfo = readConfirm();
  if (confirmInfo) view = 'confirm';
  render();
  initDb();
  const pp = prof();
  if (pp && pp.pendingClaim) finishPending(Date.now() - pp.pendingClaim.ts > 3000);
  if (pp && pp.pendingCode) {
    const c = pp.pendingCode, st = medStatus(pp);
    if (view !== 'confirm' && codeMode(pp) && st.st === 'ready' && st.time === c.t && c.d === dayStr() && Date.now() - c.ts < 3 * 3600000) openModal({ t: 'family', time: c.t, code: true });
    else { pp.pendingCode = null; persist(); }
  }
  checkReminders();
  setInterval(checkReminders, 20000);
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    finishPending(Date.now() - hiddenAt > 2500);
    checkReminders();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
